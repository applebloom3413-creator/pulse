# Persona config overlay — values here override the base config.yaml.
# Only include keys you want to change. Everything else inherits from base.

# Theme accent color for this companion in the desktop GUI (#rrggbb).
# Default is the Pulse orange; change it from the header avatar modal.
accent: "#f97316"

# Telegram is on by default — it's currently the only way to chat with a
# companion. With no bot token set it stays dormant (the engine skips it),
# so this is safe until you add a token in the Secrets editor.
channels:
  telegram:
    enabled: true

#
# Example: to give this persona its own model and data paths:
#
# provider:
#   type: "openrouter"
#   api_key_env: "MY_PERSONA_API_KEY"
#   model: "anthropic/claude-sonnet-4-20250514"
#
# heartbeat:
#   interval_minutes: 45
#   # Optional: choose which on-demand skills stay directly callable during
#   # this resident's open-ended heartbeats (for example: [tts, sticker, paint]).
#   tool_shelf_skills: [tts, sticker]
#
# paths:
#   memories: "personas/my_persona/data/memories"
#   journal: "personas/my_persona/data/journal"
#   tasks: "personas/my_persona/data/tasks.json"
#   dev_journal: "personas/my_persona/data/dev_journal.json"
#   schedules: "personas/my_persona/data/schedules.json"
#   conversation: "personas/my_persona/data/conversation.json"
#
# skills:
#   lor:
#     enabled: false

# ── Tool-cap default (ACTIVE override, not just an example) ───────────
# OpenAI rejects any request with more than 128 tools. Conversations and
# heartbeats load most tools on demand, but scheduled tasks still send the
# full tool list, and with every skill enabled that can pass the cap. `games`
# (13 tools) is disabled here to keep new personas safely under it. If you're
# cloning this for an Anthropic persona (no 128 cap), re-enable it freely.
skills:
  games:
    enabled: false
